<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Pitch-Scaled Green Waveform Audio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Top Controls UI */
        .controls {
            position: absolute;
            top: 30px;
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        input[type="file"] {
            color: #aaa;
            font-size: 14px;
        }

        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #059669;
        }

        button:disabled {
            background: #064e3b;
            color: #065f46;
            cursor: not-allowed;
        }

        /* Hide UI button is hidden by default in normal mode */
        #hideUiBtn {
            background: #334155;
            display: none; 
        }

        #hideUiBtn:hover {
            background: #475569;
        }

        /* Show Hide UI button only when in fullscreen */
        .player-container:fullscreen #hideUiBtn,
        .player-container:-webkit-full-screen #hideUiBtn {
            display: inline-block;
        }

        /* Main Player Container Box */
        .player-container {
            background: #000000;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 740px;
            transition: all 0.3s ease;
        }

        /* Fullscreen state layout */
        .player-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            justify-content: space-between;
            background: #000000;
            padding: 140px 60px 40px 60px;
        }

        .player-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            justify-content: space-between;
            background: #000000;
            padding: 140px 60px 40px 60px;
        }

        canvas {
            display: block;
            border-radius: 12px;
            width: 700px;
            height: 180px;
        }

        .player-container:fullscreen canvas {
            width: 100%;
            height: 55vh;
        }

        .player-container:-webkit-full-screen canvas {
            width: 100%;
            height: 55vh;
        }

        .fullscreen-bottom-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .player-container:fullscreen .fullscreen-bottom-group {
            max-width: 100%;
            margin: 0 auto;
        }

        .player-container:-webkit-full-screen .fullscreen-bottom-group {
            max-width: 100%;
            margin: 0 auto;
        }

        .player-actions {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .action-buttons-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .speed-control select {
            background: #1e293b;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .seek-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 5px;
        }

        .seek-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            box-shadow: 0 0 10px #10b981;
            transition: transform 0.1s;
        }

        .seek-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #64748b;
            font-variant-numeric: tabular-nums;
        }

        .track-info {
            position: absolute;
            bottom: 30px;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #64748b;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* UI Hidden State (Triggered by Hide Button or 'S' key) */
        body.ui-hidden .controls,
        body.ui-hidden .fullscreen-bottom-group,
        body.ui-hidden .track-info {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Completely borderless full screen when UI is hidden */
        body.ui-hidden .player-container:fullscreen {
            padding: 0;
        }
        body.ui-hidden .player-container:-webkit-full-screen {
            padding: 0;
        }
        body.ui-hidden canvas {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body>

    <div class="controls" id="topControls">
        <input type="file" id="audiofile" accept="audio/*">
        <button id="playbtn" disabled>Play / Pause</button>
    </div>

    <div class="player-container" id="playerContainer">
        <canvas id="canvas"></canvas>
        
        <div class="fullscreen-bottom-group">
            <div class="seek-container">
                <input type="range" id="seekSlider" class="seek-slider" value="0" min="0" max="100" step="0.1" disabled>
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div class="player-actions">
                <div class="speed-control">
                    <label for="speedSelect">Speed & Pitch:</label>
                    <select id="speedSelect">
                        <option value="0.5">0.5x (Low Pitch)</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x (Normal)</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x (Chipmunk / High Pitch)</option>
                    </select>
                </div>
                <div class="action-buttons-right">
                    <button id="hideUiBtn" title="Hide UI (Press S to show)">Hide UI</button>
                    <button id="fullscreenBtn">Fullscreen Wave</button>
                </div>
            </div>
        </div>
    </div>

    <div class="track-info" id="trackInfo">Upload an audio file to begin</div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        const audioFile = document.getElementById('audiofile');
        const audioEle = document.getElementById('audio');
        const playBtn = document.getElementById('playbtn');
        const trackInfo = document.getElementById('trackInfo');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const speedSelect = document.getElementById('speedSelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const hideUiBtn = document.getElementById('hideUiBtn');
        const playerContainer = document.getElementById('playerContainer');

        let audioCtx, analyser, source, dataArray;
        let isPlaying = false;
        let isSeeking = false;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('fullscreenchange', () => {
            setTimeout(resizeCanvas, 50);
            if (!document.fullscreenElement) {
                document.body.classList.remove('ui-hidden');
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        audioFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            audioEle.src = URL.createObjectURL(file);
            trackInfo.textContent = `Now Playing: ${file.name}`;
            playBtn.disabled = false;
            
            audioEle.addEventListener('loadedmetadata', () => {
                seekSlider.max = audioEle.duration;
                durationEl.textContent = formatTime(audioEle.duration);
                seekSlider.disabled = false;
            });

            initAudioContext();
        });

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audioEle);
                
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 2048;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                audioEle.play();
                isPlaying = true;
                playBtn.textContent = "Pause";
                renderWaveform();
            } else {
                audioEle.pause();
                isPlaying = false;
                playBtn.textContent = "Play";
            }
        });

        speedSelect.addEventListener('change', (e) => {
            const val = parseFloat(e.target.value);
            audioEle.playbackRate = val;
            if (audioEle.preservesPitch !== undefined) audioEle.preservesPitch = false;
            if (audioEle.mozPreservesPitch !== undefined) audioEle.mozPreservesPitch = false;
            if (audioEle.webkitPreservesPitch !== undefined) audioEle.webkitPreservesPitch = false;
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (playerContainer.requestFullscreen) {
                    playerContainer.requestFullscreen();
                } else if (playerContainer.webkitRequestFullscreen) {
                    playerContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Hide UI Button Action
        hideUiBtn.addEventListener('click', () => {
            document.body.classList.add('ui-hidden');
            setTimeout(resizeCanvas, 50);
        });

        // Keyboard Shortcuts ('S' to show UI, 'P' to play/pause)
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 's') {
                document.body.classList.remove('ui-hidden');
                setTimeout(resizeCanvas, 50);
            } else if (key === 'p') {
                if (!playBtn.disabled) {
                    playBtn.click();
                }
            }
        });

        audioEle.addEventListener('timeupdate', () => {
            if (!isSeeking && audioEle.duration) {
                seekSlider.value = audioEle.currentTime;
                currentTimeEl.textContent = formatTime(audioEle.currentTime);
            }
        });

        seekSlider.addEventListener('input', () => {
            isSeeking = true;
            currentTimeEl.textContent = formatTime(seekSlider.value);
        });

        seekSlider.addEventListener('change', () => {
            audioEle.currentTime = seekSlider.value;
            isSeeking = false;
        });

        function renderWaveform() {
            if (!isPlaying) return;
            requestAnimationFrame(renderWaveform);

            analyser.getByteTimeDomainData(dataArray);

            const displayWidth = canvas.clientWidth;
            const displayHeight = canvas.clientHeight;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, displayWidth, displayHeight);

            const layers = 5;
            
            for (let l = 0; l < layers; l++) {
                ctx.beginPath();

                let alpha = (l === layers - 1) ? 0.95 : 0.25 + (l * 0.1);
                ctx.strokeStyle = `rgba(16, 185, 129, ${alpha})`;
                ctx.lineWidth = (l === layers - 1) ? 2 : 1;

                let yOffset = (l - Math.floor(layers / 2)) * 3;
                let sliceWidth = displayWidth / dataArray.length;
                let x = 0;

                for (let i = 0; i < dataArray.length; i++) {
                    let v = dataArray[i] / 128.0;
                    let multiplier = 1 + (l * 0.04);
                    let y = (displayHeight / 2) + ((v - 1) * (displayHeight / 2) * multiplier) + yOffset;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#10b981';
                ctx.stroke();
            }
        }

        const initW = canvas.clientWidth;
        const initH = canvas.clientHeight;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, initW, initH);
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(0, initH / 2);
        ctx.lineTo(initW, initH / 2);
        ctx.stroke();
    </script>
</body>
</html>
